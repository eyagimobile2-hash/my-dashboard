<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마케팅 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --orange: #F76707;
    --orange-soft: #FFF0E3;
    --ink: #1F2430;
    --ink-2: #5A6272;
    --ink-3: #9AA1B0;
    --line: #E8EAF0;
    --bg: #F7F8FA;
    --card: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Pretendard", -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 20px;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  header { margin-bottom: 18px; }
  header h1 { font-size: 22px; font-weight: 700; }
  header p  { font-size: 13px; color: var(--ink-2); margin-top: 4px; }

  #status {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 28px; text-align: center; color: var(--ink-2); font-size: 14px;
  }
  #status.error { color: #C92A2A; }
  #app { display: none; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px;
  }
  .card h2 { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 12px; }

  /* ── 상단 카드 4개 ── */
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 12px; }
  .kpi .label { font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .kpi .value { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; }
  .kpi .value small { font-size: 14px; font-weight: 600; color: var(--ink-2); margin-left: 2px; }
  .kpi .sub { font-size: 12px; color: var(--ink-3); margin-top: 5px; }
  .kpi.main .value { font-size: 30px; color: var(--orange); }
  .meter { height: 8px; background: var(--line); border-radius: 4px; margin-top: 10px; overflow: hidden; }
  .meter > div { height: 100%; background: var(--orange); border-radius: 4px; }

  /* ── 채널별 표 ── */
  .table-card { margin-bottom: 12px; }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 720px; }
  th {
    text-align: right; font-weight: 600; color: var(--ink-2); font-size: 12px;
    padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  th:first-child, td:first-child { text-align: left; }
  td { text-align: right; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.ch { font-weight: 600; }
  tbody tr:hover { background: #FAFBFC; }
  tfoot td { font-weight: 700; border-bottom: none; background: #FAFBFC; }
  .roas-cell { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .roas-cell b { min-width: 44px; font-weight: 600; }
  tfoot .roas-cell b { font-weight: 700; }
  .roas-track { width: 72px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; flex: none; }
  .roas-track > div { height: 100%; background: var(--orange); border-radius: 4px; }

  /* ── 하단 2열 ── */
  .bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; }
  #trend-svg { width: 100%; height: auto; display: block; }

  .pace-row { margin-bottom: 14px; }
  .pace-row .pace-head { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-2); margin-bottom: 6px; }
  .pace-row .pace-head b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .pace-bar { height: 14px; background: var(--line); border-radius: 7px; overflow: hidden; }
  .pace-bar > div { height: 100%; border-radius: 7px; }
  .pace-bar .spent { background: var(--orange); }
  .pace-bar .days  { background: #C4C9D4; }
  #pace-msg {
    background: var(--orange-soft); border-radius: 10px; padding: 12px 14px;
    font-size: 13.5px; line-height: 1.55; margin: 6px 0 14px;
  }
  #pace-msg b { color: var(--orange); }
  .pace-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pace-stats > div { background: #FAFBFC; border: 1px solid var(--line); border-radius: 10px; padding: 10px; text-align: center; }
  .pace-stats .t { font-size: 11.5px; color: var(--ink-3); margin-bottom: 4px; }
  .pace-stats .v { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* ── 차트 툴팁 ── */
  #tip {
    position: fixed; display: none; pointer-events: none; z-index: 10;
    background: var(--ink); color: #fff; font-size: 12px; line-height: 1.5;
    padding: 8px 10px; border-radius: 8px; white-space: nowrap;
  }
  #tip b { color: #FFB380; }

  /* ── 모바일 ── */
  @media (max-width: 860px) {
    body { padding: 12px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .kpis { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>마케팅 대시보드</h1>
    <p id="subtitle">데이터 불러오는 중…</p>
  </header>

  <div id="status">데이터를 불러오는 중입니다…</div>

  <div id="app">
    <!-- 1. 상단 카드 -->
    <div class="kpis">
      <div class="card kpi main">
        <div class="label" id="k1-label">이번 달 광고비</div>
        <div class="value" id="k1-value">-</div>
        <div class="meter"><div id="k1-bar" style="width:0%"></div></div>
        <div class="sub" id="k1-sub">-</div>
      </div>
      <div class="card kpi">
        <div class="label">통합 ROAS</div>
        <div class="value" id="k2-value">-</div>
        <div class="sub" id="k2-sub">-</div>
      </div>
      <div class="card kpi">
        <div class="label">CAC (전환당 비용)</div>
        <div class="value" id="k3-value">-</div>
        <div class="sub" id="k3-sub">-</div>
      </div>
      <div class="card kpi">
        <div class="label">전환수</div>
        <div class="value" id="k4-value">-</div>
        <div class="sub" id="k4-sub">-</div>
      </div>
    </div>

    <!-- 2. 채널별 성과 표 -->
    <div class="card table-card">
      <h2>채널별 성과</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>채널</th><th>광고비</th><th>노출</th><th>클릭</th><th>CTR</th>
              <th>CPC</th><th>전환</th><th>CPA</th><th>ROAS</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
      </div>
    </div>

    <!-- 3 + 4. 하단 -->
    <div class="bottom">
      <div class="card">
        <h2>월별 광고비 · ROAS 추이</h2>
        <div id="trend"></div>
      </div>
      <div class="card">
        <h2 id="pace-title">예산 소진 페이싱</h2>
        <div class="pace-row">
          <div class="pace-head"><span>예산 소진</span><b id="p1-pct">-</b></div>
          <div class="pace-bar"><div class="spent" id="p1-bar" style="width:0%"></div></div>
        </div>
        <div class="pace-row">
          <div class="pace-head"><span>기간 경과</span><b id="p2-pct">-</b></div>
          <div class="pace-bar"><div class="days" id="p2-bar" style="width:0%"></div></div>
        </div>
        <div id="pace-msg">-</div>
        <div class="pace-stats">
          <div><div class="t">집행</div><div class="v" id="s-spent">-</div></div>
          <div><div class="t">잔여</div><div class="v" id="s-left">-</div></div>
          <div><div class="t">일 평균</div><div class="v" id="s-daily">-</div></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ─────────────────────────────────────────────
  //  ★ 여기 두 줄만 본인 값으로 바꿔 주세요 ★
  // ─────────────────────────────────────────────
  const URL = "여기에_Project_URL_붙여넣기";
  const KEY = "여기에_anon_key_붙여넣기";

  const { createClient } = supabase;
  let db = null;
  try { db = createClient(URL, KEY); } catch (e) { /* URL이 비어있거나 잘못된 경우 */ }

  // 숫자 표시 도우미
  const fmt  = n => Math.round(n).toLocaleString("ko-KR");
  const pct1 = n => (Math.round(n * 10) / 10).toLocaleString("ko-KR");
  const $ = id => document.getElementById(id);

  async function load() {
    if (URL.indexOf("붙여넣기") !== -1 || KEY.indexOf("붙여넣기") !== -1) {
      showError("코드 안의 URL / KEY 두 줄을 본인 Supabase 값으로 바꿔 주세요. (메모장으로 열어 위쪽 ★ 표시 부분 수정)");
      return;
    }
    if (!db) {
      showError("Project URL 형식이 올바르지 않습니다. https://로 시작하는 주소인지 확인해 주세요.");
      return;
    }
    const [ch, mo, bu] = await Promise.all([
      db.from("marketing_channel").select("*"),
      db.from("marketing_monthly").select("*").order("sort_order", { ascending: true }),
      db.from("marketing_budget").select("*")
    ]);
    const err = ch.error || mo.error || bu.error;
    if (err) { showError("데이터를 불러오지 못했습니다: " + err.message); return; }
    if (!ch.data.length || !bu.data.length) { showError("테이블에 데이터가 없습니다."); return; }
    render(ch.data, mo.data, bu.data[0]);
  }

  function showError(msg) {
    const st = $("status");
    st.textContent = msg;
    st.className = "error";
    $("subtitle").textContent = "연결 오류";
  }

  function render(channels, monthly, budget) {
    // ── 합계 및 지표 계산 ──
    const sum = k => channels.reduce((a, c) => a + c[k], 0);
    const tSpend = sum("spend"), tImp = sum("impressions"), tClk = sum("clicks");
    const tConv = sum("conversions"), tRev = sum("revenue");

    const roasTotal = tRev / tSpend * 100;                 // ROAS = 매출÷광고비×100
    const cac = tSpend * 10000 / tConv;                    // 만원 → 원 환산
    const cvrTotal = tConv / tClk * 100;                   // CVR = 전환÷클릭×100

    $("subtitle").textContent = budget.month + " 성과 · 캠페인 " + channels.length + "개 채널";
    $("status").style.display = "none";
    $("app").style.display = "block";

    // ── 1. 상단 카드 ──
    const spendPct = tSpend / budget.budget * 100;
    $("k1-label").textContent = budget.month + " 광고비";
    $("k1-value").innerHTML = fmt(tSpend) + "<small>만원</small>";
    $("k1-bar").style.width = Math.min(spendPct, 100) + "%";
    $("k1-sub").textContent = "예산 " + fmt(budget.budget) + "만원 중 " + pct1(spendPct) + "% 소진";

    $("k2-value").innerHTML = pct1(roasTotal) + "<small>%</small>";
    $("k2-sub").textContent = "매출 " + fmt(tRev) + "만원 ÷ 광고비 " + fmt(tSpend) + "만원";

    $("k3-value").innerHTML = fmt(cac) + "<small>원</small>";
    $("k3-sub").textContent = "광고비 ÷ 전환 " + fmt(tConv) + "건";

    $("k4-value").innerHTML = fmt(tConv) + "<small>건</small>";
    $("k4-sub").textContent = "CVR " + pct1(cvrTotal) + "% (클릭 " + fmt(tClk) + "회 중)";

    // ── 2. 채널별 표 ──
    const rows = channels.map(c => ({
      channel: c.channel,
      spend: c.spend, imp: c.impressions, clk: c.clicks, conv: c.conversions, rev: c.revenue,
      ctr:  c.clicks / c.impressions * 100,       // CTR = 클릭÷노출×100
      cpc:  c.spend * 10000 / c.clicks,           // CPC = 광고비÷클릭 (원)
      cpa:  c.spend * 10000 / c.conversions,      // CPA = 광고비÷전환 (원)
      roas: c.revenue / c.spend * 100
    })).sort((a, b) => b.spend - a.spend);

    const maxRoas = Math.max.apply(null, rows.map(r => r.roas).concat([roasTotal]));
    const roasCell = v =>
      '<div class="roas-cell"><b>' + pct1(v) + '%</b>' +
      '<span class="roas-track"><div style="width:' + (v / maxRoas * 100) + '%"></div></span></div>';

    $("tbody").innerHTML = rows.map(r =>
      "<tr><td class='ch'>" + r.channel + "</td>" +
      "<td>" + fmt(r.spend) + "만원</td>" +
      "<td>" + fmt(r.imp) + "</td>" +
      "<td>" + fmt(r.clk) + "</td>" +
      "<td>" + pct1(r.ctr) + "%</td>" +
      "<td>" + fmt(r.cpc) + "원</td>" +
      "<td>" + fmt(r.conv) + "</td>" +
      "<td>" + fmt(r.cpa) + "원</td>" +
      "<td>" + roasCell(r.roas) + "</td></tr>"
    ).join("");

    $("tfoot").innerHTML =
      "<tr><td>합계 · 평균</td>" +
      "<td>" + fmt(tSpend) + "만원</td>" +
      "<td>" + fmt(tImp) + "</td>" +
      "<td>" + fmt(tClk) + "</td>" +
      "<td>" + pct1(tClk / tImp * 100) + "%</td>" +
      "<td>" + fmt(tSpend * 10000 / tClk) + "원</td>" +
      "<td>" + fmt(tConv) + "</td>" +
      "<td>" + fmt(cac) + "원</td>" +
      "<td>" + roasCell(roasTotal) + "</td></tr>";

    // ── 3. 월별 추이 차트 ──
    drawTrend(monthly);

    // ── 4. 예산 페이싱 ──
    const daysPct = budget.days_passed / budget.days_total * 100;
    const diff = spendPct - daysPct;
    const daily = tSpend / budget.days_passed;
    const runoutDay = Math.ceil(budget.budget / daily);

    $("pace-title").textContent = budget.month + " 예산 소진 페이싱";
    $("p1-pct").textContent = pct1(spendPct) + "%";
    $("p1-bar").style.width = Math.min(spendPct, 100) + "%";
    $("p2-pct").textContent = pct1(daysPct) + "% (" + budget.days_passed + "/" + budget.days_total + "일)";
    $("p2-bar").style.width = Math.min(daysPct, 100) + "%";

    let msg;
    if (diff >= 0) {
      msg = "기간 경과보다 <b>" + pct1(diff) + "%p 빠르게</b> 소진 중입니다.";
    } else {
      msg = "기간 경과보다 <b>" + pct1(-diff) + "%p 느리게</b> 소진 중입니다.";
    }
    if (runoutDay <= budget.days_total) {
      msg += " 이 속도면 <b>" + runoutDay + "일째</b>에 예산이 바닥납니다.";
    } else {
      const projected = daily * budget.days_total;
      msg += " 이 속도면 월말까지 약 " + fmt(projected) + "만원 집행으로 <b>예산 안</b>에서 마무리됩니다.";
    }
    $("pace-msg").innerHTML = msg;

    $("s-spent").textContent = fmt(tSpend) + "만원";
    $("s-left").textContent  = fmt(budget.budget - tSpend) + "만원";
    $("s-daily").textContent = pct1(daily) + "만원";
  }

  // ── 광고비 막대 + ROAS 선 겹친 SVG 차트 ──
  function drawTrend(monthly) {
    const W = 600, H = 270, padL = 16, padR = 16, padT = 34, padB = 30;
    const iw = W - padL - padR, ih = H - padT - padB;
    const n = monthly.length;
    if (!n) { $("trend").innerHTML = "<p style='color:var(--ink-3);font-size:13px'>월별 데이터가 없습니다.</p>"; return; }

    const maxSpend = Math.max.apply(null, monthly.map(m => m.spend)) * 1.15;
    const roasVals = monthly.map(m => Number(m.roas));
    const rMin = Math.min.apply(null, roasVals), rMax = Math.max.apply(null, roasVals);
    const rPad = Math.max((rMax - rMin) * 0.35, 10);

    const slot = iw / n;
    const barW = Math.min(slot * 0.5, 44);
    const x = i => padL + slot * i + slot / 2;
    const yBar  = v => padT + ih - (v / maxSpend) * ih;
    // ROAS 선은 차트 위쪽 55% 영역에 배치 (값은 점 옆에 직접 표기)
    const yLine = v => padT + (1 - (v - (rMin - rPad)) / ((rMax + rPad) - (rMin - rPad))) * ih * 0.55;

    let s = '<svg id="trend-svg" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">';

    // 막대 (광고비)
    monthly.forEach((m, i) => {
      const bx = x(i) - barW / 2, by = yBar(m.spend), bh = padT + ih - by;
      s += '<path class="hit" data-i="' + i + '" d="M' + bx + ' ' + (by + 4) +
           ' a4 4 0 0 1 4 -4 h' + (barW - 8) + ' a4 4 0 0 1 4 4 v' + (bh - 4) +
           ' h-' + barW + ' Z" fill="#FFD9B8"/>';
      s += '<text x="' + x(i) + '" y="' + (by - 7) + '" text-anchor="middle" font-size="11" fill="#9AA1B0">' + fmt(m.spend) + '</text>';
      s += '<text x="' + x(i) + '" y="' + (H - 9) + '" text-anchor="middle" font-size="12" fill="#5A6272">' + m.month + '</text>';
    });

    // 선 (ROAS)
    const pts = monthly.map((m, i) => x(i) + ',' + yLine(Number(m.roas)));
    s += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#F76707" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    monthly.forEach((m, i) => {
      const cy = yLine(Number(m.roas));
      s += '<circle class="hit" data-i="' + i + '" cx="' + x(i) + '" cy="' + cy + '" r="4.5" fill="#F76707" stroke="#fff" stroke-width="2"/>';
      s += '<text x="' + x(i) + '" y="' + (cy - 10) + '" text-anchor="middle" font-size="11.5" font-weight="600" fill="#F76707">' + pct1(Number(m.roas)) + '%</text>';
    });

    // 범례
    s += '<rect x="' + padL + '" y="8" width="10" height="10" rx="3" fill="#FFD9B8"/>' +
         '<text x="' + (padL + 15) + '" y="17" font-size="11.5" fill="#5A6272">광고비(만원)</text>' +
         '<line x1="' + (padL + 96) + '" y1="13" x2="' + (padL + 114) + '" y2="13" stroke="#F76707" stroke-width="2.5"/>' +
         '<text x="' + (padL + 119) + '" y="17" font-size="11.5" fill="#5A6272">ROAS(%)</text>';

    s += '</svg>';
    $("trend").innerHTML = s;

    // 툴팁
    const tip = $("tip");
    document.querySelectorAll("#trend .hit").forEach(el => {
      el.addEventListener("mousemove", e => {
        const m = monthly[Number(el.getAttribute("data-i"))];
        tip.innerHTML = m.month + "<br>광고비 <b>" + fmt(m.spend) + "만원</b><br>ROAS <b>" + pct1(Number(m.roas)) + "%</b>";
        tip.style.display = "block";
        tip.style.left = Math.min(e.clientX + 14, window.innerWidth - 150) + "px";
        tip.style.top = (e.clientY - 10) + "px";
      });
      el.addEventListener("mouseleave", () => { tip.style.display = "none"; });
    });
  }

  load();
</script>
</body>
</html>
