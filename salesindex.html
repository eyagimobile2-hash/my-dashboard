<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>영업 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{
    --blue:#2a78d6;          /* 포인트 색 (단일) */
    --blue-deep:#1c5cab;
    --blue-mid:#5598e7;
    --blue-soft:#86b6ef;     /* 비강조 막대 */
    --blue-faint:#cde2fb;    /* 게이지 트랙 */
    --ink:#0b0b0b;
    --ink-2:#52514e;
    --ink-3:#898781;
    --grid:#e9e8e4;
    --baseline:#c3c2b7;
    --border:rgba(11,11,11,.10);
    --surface:#ffffff;
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--surface);color:var(--ink);
    font-family:"Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:24px 20px 48px}
  header{display:flex;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
  header h1{font-size:22px;font-weight:700;margin:0}
  header .sub{font-size:14px;color:var(--ink-3)}
  .state{padding:32px 0;color:var(--ink-3);font-size:15px}
  .state.error{color:#c0392b}

  /* 카드 */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .card{border:1px solid var(--border);border-radius:14px;padding:18px 18px 16px;background:var(--surface)}
  .card .label{font-size:13px;color:var(--ink-2);margin-bottom:6px}
  .card .value{font-size:24px;font-weight:700;line-height:1.15}
  .card.hero .value{font-size:34px}
  .card .note{font-size:13px;color:var(--ink-3);margin-top:6px}
  .card .note strong{color:var(--ink-2);font-weight:600}
  .meter{margin-top:12px;height:8px;border-radius:4px;background:var(--blue-faint);overflow:hidden}
  .meter>i{display:block;height:100%;border-radius:4px;background:var(--blue)}
  .rate{font-size:13px;color:var(--ink-2);margin-top:6px}
  .rate b{color:var(--blue-deep);font-weight:700}

  /* 패널 2단 */
  .grid2{display:grid;grid-template-columns:3fr 2fr;gap:12px;margin-bottom:16px}
  .grid2.even{grid-template-columns:1fr 1fr}
  .panel{border:1px solid var(--border);border-radius:14px;padding:18px;background:var(--surface)}
  .panel h2{font-size:15px;font-weight:700;margin:0 0 4px}
  .panel .desc{font-size:12.5px;color:var(--ink-3);margin:0 0 14px}
  .panel svg{display:block;width:100%;height:auto}

  /* 깔때기 */
  .funnel-row{display:grid;grid-template-columns:76px 1fr 56px;align-items:center;gap:10px}
  .funnel-row .name{font-size:13px;color:var(--ink-2);text-align:right}
  .funnel-row .track{height:22px;display:flex;justify-content:center}
  .funnel-row .bar{height:22px;border-radius:4px;min-width:6px}
  .funnel-row .cnt{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .funnel-conv{display:grid;grid-template-columns:76px 1fr 56px;gap:10px}
  .funnel-conv span{grid-column:2;text-align:center;font-size:12px;color:var(--ink-3);padding:3px 0}
  .funnel-total{margin-top:14px;padding-top:12px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--ink-2)}
  .funnel-total b{font-size:20px;font-weight:700;color:var(--blue-deep)}

  /* 순위 */
  .rank-row{display:grid;grid-template-columns:84px 1fr 84px;align-items:center;gap:10px;padding:7px 0}
  .rank-row .name{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-row .name b{color:var(--ink);font-weight:600}
  .rank-row .track{height:14px}
  .rank-row .bar{height:14px;border-radius:0 4px 4px 0;background:var(--blue-soft);min-width:4px}
  .rank-row:first-child .bar{background:var(--blue)}
  .rank-row .amt{font-size:13px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
  .rank-row:first-child .amt{color:var(--ink);font-weight:600}

  /* 툴팁 */
  #tip{position:fixed;z-index:10;pointer-events:none;display:none;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.10);padding:10px 12px;font-size:13px;line-height:1.55}
  #tip .t{font-weight:700;margin-bottom:2px}
  #tip .r{color:var(--ink-2)}
  #tip .r b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

  @media (max-width:860px){
    .cards{grid-template-columns:1fr 1fr}
    .grid2,.grid2.even{grid-template-columns:1fr}
    .card.hero .value{font-size:30px}
  }
  @media (max-width:400px){
    .cards{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>영업 대시보드</h1>
    <span class="sub" id="asof"></span>
  </header>

  <div id="loading" class="state">데이터를 불러오는 중…</div>
  <div id="error" class="state error" style="display:none"></div>

  <div id="app" style="display:none">
    <section class="cards">
      <div class="card hero">
        <div class="label">이번 달 매출</div>
        <div class="value" id="c-rev"></div>
        <div class="meter"><i id="c-meter"></i></div>
        <div class="rate">목표 대비 <b id="c-rate"></b> 달성</div>
      </div>
      <div class="card">
        <div class="label">이번 달 목표</div>
        <div class="value" id="c-target"></div>
        <div class="note" id="c-remain"></div>
      </div>
      <div class="card">
        <div class="label">객단가</div>
        <div class="value" id="c-avg"></div>
        <div class="note">이번 달 매출 ÷ 계약 건수</div>
      </div>
      <div class="card">
        <div class="label">계약 건수</div>
        <div class="value" id="c-deals"></div>
        <div class="note" id="c-deals-note"></div>
      </div>
    </section>

    <section class="grid2">
      <div class="panel">
        <h2>월별 매출</h2>
        <p class="desc">진한 막대가 이번 달 · 점선은 이번 달 목표</p>
        <div id="barchart"></div>
      </div>
      <div class="panel">
        <h2>영업 단계 깔때기</h2>
        <p class="desc">단계 사이 %는 이전 단계 대비 전환율</p>
        <div id="funnel"></div>
        <div class="funnel-total"><span>최종 전환율 (마지막 단계 ÷ 첫 단계)</span><b id="funnel-final"></b></div>
      </div>
    </section>

    <section class="grid2 even">
      <div class="panel">
        <h2>담당자별 순위</h2>
        <p class="desc">매출액 기준</p>
        <div id="rank-person"></div>
      </div>
      <div class="panel">
        <h2>상품별 순위</h2>
        <p class="desc">매출액 기준</p>
        <div id="rank-product"></div>
      </div>
    </section>
  </div>
</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const { createClient } = supabase;
  const db = createClient(
    'https://bcjbafdasrnolqkypndh.supabase.co',
    'sb_publishable_9KnndZ872V_bD8C6F-C_sw_ZWjH9KWB'
  );

  /* ---------- 포맷 ---------- */
  // DB에 저장된 금액의 단위. 만원 단위면 10000, 원 단위면 1로 바꾸세요.
  const UNIT = 10000;
  function fmtMoney(n){
    n = (Number(n) || 0) * UNIT;
    const sign = n < 0 ? '-' : '';
    const a = Math.abs(n);
    if (a >= 1e8){
      const v = a / 1e8;
      return sign + (v >= 100 ? Math.round(v).toLocaleString('ko-KR') : String(Math.round(v*10)/10)) + '억원';
    }
    if (a >= 1e4){
      const v = a / 1e4;
      return sign + (v >= 100 ? Math.round(v).toLocaleString('ko-KR') : String(Math.round(v*10)/10)) + '만원';
    }
    return sign + Math.round(a).toLocaleString('ko-KR') + '원';
  }
  function fmtFull(n){ return Math.round((Number(n)||0) * UNIT).toLocaleString('ko-KR') + '원'; }
  function fmtMonth(m){
    const s = String(m ?? '');
    const ym = s.match(/^(\d{4})[-./](\d{1,2})/);
    if (ym) return parseInt(ym[2],10) + '월';
    return s;
  }
  function pct(n){ return (Math.round(n*10)/10) + '%'; }

  /* ---------- 툴팁 ---------- */
  const tip = document.getElementById('tip');
  function showTip(html, x, y){
    tip.innerHTML = html;
    tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    let left = x + 14, top = y + 14;
    if (left + r.width > window.innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > window.innerHeight - 8) top = y - r.height - 14;
    tip.style.left = Math.max(8,left) + 'px';
    tip.style.top = Math.max(8,top) + 'px';
  }
  function hideTip(){ tip.style.display = 'none'; }

  /* ---------- 카드 ---------- */
  function renderCards(monthly, pipeline){
    const cur = monthly[monthly.length - 1];
    const rev = Number(cur.revenue)||0, tgt = Number(cur.target)||0;
    const rate = tgt > 0 ? rev/tgt*100 : 0;
    const remain = Math.max(tgt - rev, 0);
    const lastStage = pipeline[pipeline.length - 1];
    const deals = Number(lastStage?.count)||0;

    document.getElementById('asof').textContent = fmtMonth(cur.month) + ' 기준';
    document.getElementById('c-rev').textContent = fmtMoney(rev);
    document.getElementById('c-meter').style.width = Math.min(rate,100) + '%';
    document.getElementById('c-rate').textContent = pct(rate);
    document.getElementById('c-target').textContent = fmtMoney(tgt);
    document.getElementById('c-remain').innerHTML = remain > 0
      ? '남은 금액 <strong>' + fmtMoney(remain) + '</strong>'
      : '목표 초과 달성 <strong>+' + fmtMoney(rev - tgt) + '</strong>';
    document.getElementById('c-avg').textContent = deals > 0 ? fmtMoney(rev/deals) : '—';
    document.getElementById('c-deals').textContent = deals.toLocaleString('ko-KR') + '건';
    document.getElementById('c-deals-note').textContent = lastStage ? '파이프라인 "' + lastStage.stage + '" 단계' : '';
  }

  /* ---------- 월별 막대그래프 (SVG) ---------- */
  function niceCeil(v){
    if (v <= 0) return 1;
    const p = Math.pow(10, Math.floor(Math.log10(v)));
    const d = v / p;
    const n = d <= 1 ? 1 : d <= 2 ? 2 : d <= 2.5 ? 2.5 : d <= 5 ? 5 : 10;
    return n * p;
  }
  function renderBarChart(monthly){
    const W = 560, H = 260, padL = 64, padR = 16, padT = 26, padB = 30;
    const cw = W - padL - padR, ch = H - padT - padB;
    const cur = monthly[monthly.length - 1];
    const tgt = Number(cur.target)||0;
    const maxV = niceCeil(Math.max(...monthly.map(d => Number(d.revenue)||0), tgt) * 1.08);
    const y = v => padT + ch - (v / maxV) * ch;
    const band = cw / monthly.length;
    const bw = Math.min(24, band * 0.55);

    let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="월별 매출 막대그래프">';
    // 가로 눈금선 + y축 라벨
    const ticks = 4;
    for (let i = 0; i <= ticks; i++){
      const v = maxV / ticks * i, yy = y(v);
      s += '<line x1="'+padL+'" y1="'+yy+'" x2="'+(W-padR)+'" y2="'+yy+'" stroke="'+(i===0?'#c3c2b7':'#e9e8e4')+'" stroke-width="1"/>';
      if (i > 0) s += '<text x="'+(padL-8)+'" y="'+(yy+4)+'" text-anchor="end" font-size="11" fill="#898781">'+fmtMoney(v)+'</text>';
    }
    // 막대
    monthly.forEach((d, i) => {
      const rev = Number(d.revenue)||0;
      const x = padL + band*i + (band - bw)/2;
      const yy = y(rev), h = Math.max(padT + ch - yy, 0);
      const isCur = i === monthly.length - 1;
      const fill = isCur ? '#2a78d6' : '#86b6ef';
      const rr = Math.min(4, h);
      s += '<path class="bar-hit" data-i="'+i+'" fill="'+fill+'" d="M'+x+' '+(padT+ch)
         + ' V'+(yy+rr)+' Q'+x+' '+yy+' '+(x+rr)+' '+yy
         + ' H'+(x+bw-rr)+' Q'+(x+bw)+' '+yy+' '+(x+bw)+' '+(yy+rr)
         + ' V'+(padT+ch)+' Z"/>';
      // 히트 영역(막대보다 넓게, 투명)
      s += '<rect class="bar-hit" data-i="'+i+'" x="'+(padL+band*i)+'" y="'+padT+'" width="'+band+'" height="'+ch+'" fill="transparent"/>';
      if (isCur) s += '<text x="'+(x+bw/2)+'" y="'+(yy-7)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#0b0b0b">'+fmtMoney(rev)+'</text>';
      s += '<text x="'+(x+bw/2)+'" y="'+(H-9)+'" text-anchor="middle" font-size="11.5" fill="'+(isCur?'#0b0b0b':'#898781')+'"'+(isCur?' font-weight="700"':'')+'>'+fmtMonth(d.month)+'</text>';
    });
    // 목표 점선 (이번 달 목표)
    if (tgt > 0){
      const ty = y(tgt);
      s += '<line x1="'+padL+'" y1="'+ty+'" x2="'+(W-padR)+'" y2="'+ty+'" stroke="#52514e" stroke-width="1.5" stroke-dasharray="5 4"/>';
      s += '<text x="'+(W-padR)+'" y="'+(ty-6)+'" text-anchor="end" font-size="11" fill="#52514e">목표 '+fmtMoney(tgt)+'</text>';
    }
    s += '</svg>';
    const el = document.getElementById('barchart');
    el.innerHTML = s;

    el.addEventListener('mousemove', e => {
      const t = e.target.closest('.bar-hit');
      if (!t) { hideTip(); return; }
      const d = monthly[Number(t.dataset.i)];
      const rev = Number(d.revenue)||0, tg = Number(d.target)||0;
      showTip('<div class="t">'+fmtMonth(d.month)+'</div>'
        + '<div class="r">매출 <b>'+fmtFull(rev)+'</b></div>'
        + '<div class="r">목표 <b>'+fmtFull(tg)+'</b></div>'
        + (tg>0 ? '<div class="r">달성률 <b>'+pct(rev/tg*100)+'</b></div>' : ''),
        e.clientX, e.clientY);
    });
    el.addEventListener('mouseleave', hideTip);
  }

  /* ---------- 깔때기 ---------- */
  function renderFunnel(pipeline){
    const shades = ['#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab'];
    const first = Number(pipeline[0]?.count)||0;
    let html = '';
    pipeline.forEach((d, i) => {
      const c = Number(d.count)||0;
      const w = first > 0 ? Math.max(c/first*100, 2) : 2;
      const color = shades[Math.min(Math.round(i/(Math.max(pipeline.length-1,1))*(shades.length-1)), shades.length-1)];
      if (i > 0){
        const prev = Number(pipeline[i-1].count)||0;
        html += '<div class="funnel-conv"><span>↓ '+(prev>0?pct(c/prev*100):'—')+'</span></div>';
      }
      html += '<div class="funnel-row" data-i="'+i+'">'
        + '<div class="name">'+d.stage+'</div>'
        + '<div class="track"><div class="bar" style="width:'+w+'%;background:'+color+'"></div></div>'
        + '<div class="cnt">'+c.toLocaleString('ko-KR')+'건</div></div>';
    });
    const el = document.getElementById('funnel');
    el.innerHTML = html;
    const last = Number(pipeline[pipeline.length-1]?.count)||0;
    document.getElementById('funnel-final').textContent = first > 0 ? pct(last/first*100) : '—';

    el.addEventListener('mousemove', e => {
      const row = e.target.closest('.funnel-row');
      if (!row) { hideTip(); return; }
      const i = Number(row.dataset.i), d = pipeline[i];
      const c = Number(d.count)||0;
      showTip('<div class="t">'+d.stage+'</div>'
        + '<div class="r">건수 <b>'+c.toLocaleString('ko-KR')+'건</b></div>'
        + (first>0 ? '<div class="r">첫 단계 대비 <b>'+pct(c/first*100)+'</b></div>' : ''),
        e.clientX, e.clientY);
    });
    el.addEventListener('mouseleave', hideTip);
  }

  /* ---------- 순위 ---------- */
  function renderRank(rows, elId){
    const max = Math.max(...rows.map(d => Number(d.amount)||0), 1);
    const el = document.getElementById(elId);
    el.innerHTML = rows.map((d, i) => {
      const a = Number(d.amount)||0;
      return '<div class="rank-row" data-i="'+i+'">'
        + '<div class="name"><b>'+(i+1)+'위</b> '+d.name+'</div>'
        + '<div class="track"><div class="bar" style="width:'+(a/max*100)+'%"></div></div>'
        + '<div class="amt">'+fmtMoney(a)+'</div></div>';
    }).join('');
    el.addEventListener('mousemove', e => {
      const row = e.target.closest('.rank-row');
      if (!row) { hideTip(); return; }
      const d = rows[Number(row.dataset.i)];
      showTip('<div class="t">'+d.name+'</div><div class="r">매출 <b>'+fmtFull(d.amount)+'</b></div>', e.clientX, e.clientY);
    });
    el.addEventListener('mouseleave', hideTip);
  }

  /* ---------- 로드 ---------- */
  async function load(){
    try{
      const [m, p, r] = await Promise.all([
        db.from('sales_monthly').select('*').order('sort_order', { ascending: true }),
        db.from('sales_pipeline').select('*').order('sort_order', { ascending: true }),
        db.from('sales_rank').select('*').order('amount', { ascending: false })
      ]);
      const err = m.error || p.error || r.error;
      if (err) throw err;
      if (!m.data?.length || !p.data?.length) throw new Error('테이블에 데이터가 없습니다.');

      renderCards(m.data, p.data);
      renderBarChart(m.data);
      renderFunnel(p.data);
      renderRank(r.data.filter(d => d.kind === 'person'), 'rank-person');
      renderRank(r.data.filter(d => d.kind === 'product'), 'rank-product');

      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    }catch(e){
      document.getElementById('loading').style.display = 'none';
      const el = document.getElementById('error');
      el.style.display = 'block';
      el.textContent = '데이터를 불러오지 못했습니다: ' + (e.message || e);
    }
  }
  load();
</script>
</body>
</html>
